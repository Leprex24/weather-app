name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Pobranie kodu źródłowego z repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Konfiguracja QEMU – potrzebne do emulacji arm64 na amd64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Konfiguracja buildx z domyślnym builderem
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Logowanie do ghcr.io
      #    Token GITHUB_TOKEN jest automatycznie dostępny w GH Actions
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Logowanie do DockerHub – potrzebne do zapisu/odczytu cache
      #    Dane logowania przechowywane jako sekrety repo
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Generowanie tagów i labelów obrazu
      #    sha tagu zapewnia unikalność każdego builda
      #    latest zawsze wskazuje na najnowszy build z main
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # 7. Budowanie obrazu dla obu platform z cache z DockerHub
      #    Obraz NIE jest jeszcze pushowany – najpierw skan CVE
      #    cache-from/cache-to używa DockerHub jako backend
      - name: Build image (no push yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=leprex24/pawcho-sawicki:cache
          cache-to: type=registry,ref=leprex24/pawcho-sawicki:cache,mode=max
          outputs: type=docker,dest=/tmp/image.tar

      # 8. Ładowanie obrazu lokalnie do skanu (tylko amd64)
      - name: Load image for scanning
        run: docker load --input /tmp/image.tar

      # 9. Skan CVE obrazu przez Trivy
      #    exit-code: '1' – pipeline zatrzyma się jeśli znajdzie CRITICAL lub HIGH
      #    Obraz nie zostanie wypchnięty na ghcr.io jeśli skan wykryje zagrożenia
      - name: Run Trivy CVE scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # 10. Push obrazu na ghcr.io jeśli skan CVE przeszedł pomyślnie
      - name: Push image to ghcr.io
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=leprex24/pawcho-sawicki:cache
          cache-to: type=registry,ref=leprex24/pawcho-sawicki:cache,mode=max