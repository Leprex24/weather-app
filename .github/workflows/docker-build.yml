name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # 1. Pobranie kodu źródłowego z repozytorium
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Konfiguracja QEMU – potrzebne do emulacji arm64 na amd64
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3. Konfiguracja buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4. Logowanie do ghcr.io
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Logowanie do DockerHub – potrzebne do cache
      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 6. Generowanie tagów finalnych
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      # 7. Budowanie i push obrazu do tymczasowego taga scan
      #    Obraz trafia najpierw pod tag :scan – przed skanem CVE
      - name: Build and push to scan tag
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository }}:scan
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pawcho-sawicki:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pawcho-sawicki:cache,mode=max

      # 8. Skan CVE obrazu przez Trivy
      #    Skanujemy obraz z ghcr.io po tagu :scan
      #    exit-code: '1' zatrzymuje pipeline jeśli znajdzie CRITICAL lub HIGH
      - name: Run Trivy CVE scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}:scan
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # 9. Push finalnych tagów – TYLKO jeśli skan CVE przeszedł pomyślnie
      - name: Push final tags
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pawcho-sawicki:cache
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/pawcho-sawicki:cache,mode=max